<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attendance Assistant</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#E8EDF4; --surface:#FFFFFF; --surface-2:#F1F4F9; --ink:#15203B; --ink-2:#55627D; --line:#D5DDE8;
  --accent:#3D4FD8;
  --present:#08806D; --present-on:#FFFFFF; --present-bg:#DDF4EE;
  --late:#EBA92A;    --late-on:#15203B;    --late-bg:#FBEFD2;
  --absent:#C93443;  --absent-on:#FFFFFF;  --absent-bg:#FBE2E4;
  --none:#9AA6BC;
  --assist-bg:#1D2760; --assist-ink:#EEF1FF; --assist-soft:rgba(255,255,255,.12); --assist-line:rgba(255,255,255,.28);
  --shadow:0 1px 2px rgba(21,32,59,.06),0 8px 24px rgba(21,32,59,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1424; --surface:#172038; --surface-2:#1E2946; --ink:#E7ECF7; --ink-2:#9AA7C4; --line:#2B3858;
    --accent:#8B97FF;
    --present:#2FC4A8; --present-on:#06251F; --present-bg:#12352F;
    --late:#F0B84A;    --late-on:#2A1E00;    --late-bg:#3A2F14;
    --absent:#FF6B78;  --absent-on:#3B0A10;  --absent-bg:#3B1A22;
    --none:#5F6C89;
    --assist-bg:#222D6E; --assist-ink:#EEF1FF;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1424; --surface:#172038; --surface-2:#1E2946; --ink:#E7ECF7; --ink-2:#9AA7C4; --line:#2B3858;
  --accent:#8B97FF;
  --present:#2FC4A8; --present-on:#06251F; --present-bg:#12352F;
  --late:#F0B84A;    --late-on:#2A1E00;    --late-bg:#3A2F14;
  --absent:#FF6B78;  --absent-on:#3B0A10;  --absent-bg:#3B1A22;
  --none:#5F6C89;
  --assist-bg:#222D6E; --assist-ink:#EEF1FF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
